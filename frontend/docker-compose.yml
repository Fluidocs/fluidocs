services:
  frontend:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: dev
    container_name: fluidocs_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      # Espelha a pasta local no contêiner para o Hot Reload funcionar
      - .:/app
      # Cria um volume anônimo para a pasta node_modules para não dar conflito com o host
      - /app/node_modules
    env_file:
      - .env
    environment:
      # O navegador chama /api no mesmo host do Vite; o proxy encaminha ao orquestrador no host.
      - VITE_API_URL=/api
      - VITE_API_PROXY_TARGET=http://host.docker.internal:8000
      # Garante que o Vite escute todas as interfaces de rede para porta 3000
      - HOST=0.0.0.0
      # Garante Hot Reload no Docker Desktop/Windows, onde eventos de arquivo
      # nem sempre chegam ao contêiner via bind mount.
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_HMR_HOST=localhost
      - VITE_HMR_CLIENT_PORT=3000