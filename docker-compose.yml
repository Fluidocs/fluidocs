services:
  frontend:
    build:
      context: ./frontend
      dockerfile: .docker/Dockerfile
      target: dev
    container_name: fluidocs_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - VITE_API_URL=/api
      - VITE_API_PROXY_TARGET=http://host.docker.internal:8000
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_HMR_HOST=localhost
      - VITE_HMR_CLIENT_PORT=3000
  api:
    container_name: fluidocs-api
    image: fluidocs-api:dev
    build: 
      context: ./backend
      dockerfile: .docker/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "${SERVER_PORT}:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - temp_data:/tmp/docs
    depends_on:
      postgresql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - fluidocs_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:9.3.1
    container_name: es-fluidocs
    environment:
      - node_name=es01
      - cluster_name=es-docker-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - fluidocs_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama:
    image: ollama/ollama
    container_name: fluidocs-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - fluidocs_network

  celery-worker:
    image: fluidocs-api:dev
    container_name: elastic-worker
    command: uv run celery -A backend.workers.app_celery worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-1}
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/.venv
      - temp_data:/tmp/docs
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - fluidocs_network

  redis:
    image: redis:8.6.2-alpine
    container_name: fluidocs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fluidocs_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  postgresql:
    image: postgres:17
    container_name: fluidocs-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${NOME_BD}
      - POSTGRES_USER=${USUARIO_BD}
      - POSTGRES_PASSWORD=${SENHA_BD}
    ports: 
      - "${PORTA_BD}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fluidocs_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USUARIO_BD} -d ${NOME_BD}"]
      interval: 5s
      timeout: 30s
      retries: 10

volumes:
  elastic_data:
  ollama_data:
  redis_data:
  temp_data:
  postgres_data:

networks:
  fluidocs_network:
    driver: bridge
