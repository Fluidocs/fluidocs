[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vToshio", email = "vtoshio2004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aerich>=0.10.1",
    "aiohttp>=3.14.3",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "elasticsearch>=9.5.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.2",
    "opencv-python>=5.0.0.93",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "pymupdf4llm>=1.28.2",
    "pytesseract>=0.3.13",
    "tortoise-orm>=1.1.8",
]

[tool.aerich]
tortoise_orm = "backend.db.conexao.TORTOISE_CONFIG"
location = "./src/backend/db/migrations/"
src_folder = "./src"

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
