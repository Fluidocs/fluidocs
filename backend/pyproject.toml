[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vToshio", email = "vtoshio2004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "celery[redis]>=5.6.3",
    "elasticsearch>=9.5.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.2",
    "opencv-python>=5.0.0.93",
    "pydantic-settings>=2.15.0",
    "pymupdf4llm>=1.28.2",
    "pytesseract>=0.3.13",
    "tortoise-orm>=1.1.8",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
